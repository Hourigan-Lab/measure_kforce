[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kforce"
version = "0.2.0"
description = "k-mer force-caller for known SV/ITD/indel variants in MRD sequencing data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pysam", "openpyxl", "numpy"]

[project.scripts]
kforce = "kforce.cli:main"

[tool.setuptools.packages.find]
include = ["kforce*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
